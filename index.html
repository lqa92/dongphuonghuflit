<html lang="vi">

<style>
/* Layout: một cột, bộ lọc năm học/học kỳ dùng chung, ba tab (Tổng hợp, Nhập môn dạy, Quản trị). */
:root {
  --bg: #f1f4f8;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #152033;
  --muted: #5a6a7f;
  --line: #dbe2ea;
  --accent: #1f3a5f;
  --accent-ink: #ffffff;
  --han: #2d6da3;
  --nhat: #c2455a;
  --viet: #3b8a5a;
  --ok-bg: #e3f3e9; --ok-ink: #1d6a3b;
  --soon-bg: #fdf0d5; --soon-ink: #8a5a00;
  --lock-bg: #e8ecf1; --lock-ink: #4b5a6e;
  --danger: #b3342f;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1520; --surface: #162130; --surface-2: #1b2839; --ink: #e8edf4; --muted: #93a3b7; --line: #263548;
    --accent: #9cbdea; --accent-ink: #0e1520;
    --han: #6ba8dd; --nhat: #e47e90; --viet: #70c18d;
    --ok-bg: #173a27; --ok-ink: #8fdaa9; --soon-bg: #433210; --soon-ink: #f2c46a; --lock-bg: #243346; --lock-ink: #a9b8cb;
    --danger: #ef8780;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1520; --surface: #162130; --surface-2: #1b2839; --ink: #e8edf4; --muted: #93a3b7; --line: #263548;
  --accent: #9cbdea; --accent-ink: #0e1520;
  --han: #6ba8dd; --nhat: #e47e90; --viet: #70c18d;
  --ok-bg: #173a27; --ok-ink: #8fdaa9; --soon-bg: #433210; --soon-ink: #f2c46a; --lock-bg: #243346; --lock-ink: #a9b8cb;
  --danger: #ef8780;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); }
.filters { display: flex; gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
select, input[type="number"], input[type="text"], input[type="date"], input[type="search"], input[type="password"], input[type="email"] {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 42px; min-width: 0; width: 100%;
}
.filters select { width: auto; }
select:disabled, input:disabled { opacity: .6; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-radius: 10px; font-size: 14px; }
.status b { font-weight: 600; }
.status.open { background: var(--ok-bg); color: var(--ok-ink); }
.status.soon { background: var(--soon-bg); color: var(--soon-ink); }
.status.locked { background: var(--lock-bg); color: var(--lock-ink); }

.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
.tab { flex: 1; font: inherit; font-weight: 600; font-size: 14px; padding: 9px 8px; min-height: 40px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.panel + .panel { margin-top: 14px; }
.panel-h { padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.panel-h h2 { margin: 0; font-size: 16px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; min-height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.facts b { color: var(--ink); font-family: var(--font-num); font-weight: 600; font-size: 14px; }

.row { border-bottom: 1px solid var(--line); --c: var(--accent); }
.row[data-dept="han"] { --c: var(--han); }
.row[data-dept="nhat"] { --c: var(--nhat); }
.row[data-dept="viet"] { --c: var(--viet); }
.row-btn {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer; padding: 12px 16px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who num" "bar bar"; gap: 8px 12px; align-items: center;
}
.row-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row-btn:hover { background: var(--surface-2); }
.who { grid-area: who; min-width: 0; display: flex; flex-direction: column; }
.nm { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.guest { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--soon-bg); color: var(--soon-ink); }
.bar { grid-area: bar; position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--c); }
.tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
.num { grid-area: num; font-family: var(--font-num); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; }
.num small { font-size: 12px; color: var(--muted); font-family: var(--font-body); font-weight: 500; margin-left: 3px; }
.num.none { color: var(--muted); font-size: 16px; }
@media (min-width: 640px) {
  .row-btn { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) 6.5rem; grid-template-areas: "who bar num"; gap: 16px; }
}
.detail { padding: 2px 16px 14px; background: var(--surface-2); border-top: 1px dashed var(--line); }
.detail ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.detail li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.detail li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.detail .co { display: block; font-size: 12px; color: var(--muted); }
.detail .t { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; font-weight: 600; }
.total-row .num { font-size: 20px; }
.legend { padding: 0 16px 14px; font-size: 12px; color: var(--muted); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

.body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: end; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
@media (max-width: 520px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.check { display: flex; align-items: center; gap: 10px; min-height: 42px; font-size: 14px; }
.check input { width: 20px; height: 20px; flex: none; }
.btn { font: inherit; font-weight: 600; font-size: 15px; min-height: 42px; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { min-height: 36px; padding: 6px 14px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.err { font-size: 13px; color: var(--danger); margin: 0; min-height: 1em; }
.sect-h { margin: 0; font-size: 14px; font-weight: 700; }
.calc { font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); margin: 0; }
.calc b { font-family: var(--font-num); font-weight: 600; }
.mine { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; }
.mine li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.mine li:last-child { border-bottom: 0; }
.mine .nmc { min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; }
.mine .sm { font-size: 12px; color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.mine .ctl { display: flex; align-items: center; gap: 8px; flex: none; }
.mine .pct { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.mine input[type="number"] { width: 4.8rem; text-align: right; font-family: var(--font-num); }
.x { font: inherit; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--danger); cursor: pointer; font-size: 18px; line-height: 1; }
.mine .ro { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.mine-total { display: flex; justify-content: space-between; font-weight: 600; padding-top: 4px; }
.mine-total .v { font-family: var(--font-num); }
.dates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.cat { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 10px; max-height: 320px; overflow-y: auto; }
.cat li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
.cat li:last-child { border-bottom: 0; }
.cat .t { font-family: var(--font-num); white-space: nowrap; color: var(--muted); }
details.dp > summary { cursor: pointer; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; min-height: 36px; }
details.dp[open] > summary { margin-bottom: 8px; }
.note { font-size: 13px; color: var(--muted); padding: 10px 12px; background: var(--surface-2); border-radius: 8px; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .25s ease; } }
.hello { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; }
#status { display: flex; flex-direction: column; gap: 8px; }
.linkbtn{font:inherit;font-size:13px;background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
</style>

<body>
<div class="wrap">

      <h1>Quản lý giờ dạy</h1>

    <div class="filters">
      <label class="f">Năm học<select id="fYear"></select></label>

    <button class="tab" role="tab" data-tab="admin" id="adminTab" hidden>Quản trị</button>
  </nav>

  <main id="main"></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXB8Bak4bTCLsZbVGmxbdAOiYfFMXxdOw",
  authDomain: "dong-aa364.firebaseapp.com",
  projectId: "dong-aa364",
  storageBucket: "dong-aa364.firebasestorage.app",
  messagingSenderId: "109564044579",
  appId: "1:109564044579:web:bae67a5ad8ea097ca49896"
};
/* Email của người quản trị (cô phó khoa). Phải giống email trong Rules của Firestore. */


/* Email của người quản trị. Phải giống email trong Rules của Firestore. */
const ADMIN_EMAILS = ['quocanluong@gmail.com'];
/* Mỗi thầy cô đăng nhập bằng một "email nội bộ" tạo từ tên, thầy cô không cần biết. */
const DOMAIN = 'giangvien.khoa';
/* Danh sách tên có sẵn. Muốn thêm tên mới thì vào tab Quản trị. */
const DEFAULT_ROSTER = ['Lương Quốc An', 'Hoàng Nguyên Phương', 'Nguyễn Thị Kim Ngọc', 'Huỳnh Thanh Long'];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var fmt = function (n) { return Number(n).toLocaleString('vi-VN', { maximumFractionDigits: 1 }); };
  var fd = function (iso) { return iso.split('-').reverse().join('/'); };
  var today = function () { return new Date().toLocaleDateString('en-CA'); };

  var DEPTS = [
    { id: 'han', name: 'Tiếng Hàn', short: 'Hàn' },
    { id: 'nhat', name: 'Tiếng Nhật', short: 'Nhật' },
    { id: 'viet', name: 'Việt Nam học', short: 'Việt Nam học' }
  ];
  var deptOf = function (id) { return DEPTS.filter(function (d) { return d.id === id; })[0] || DEPTS[0]; };

  /* Danh mục môn từ file của khoa: [bộ môn, tên môn, [số tín chỉ có thể chọn]] */
  var RAW = /*COURSES*/[];
  var base = RAW.map(function (r, i) { return { id: 'c' + i, dept: r[0], name: r[1], cr: r[2] }; });
  var courses = [], courseMap = {};
  var cById = function (id) { return courseMap[id]; };
  function rebuildCourses() {
    courses = base.concat(X.map(function (x) { return { id: x.id, dept: x.dept, name: x.name, cr: x.cr }; }));
    courses.sort(function (a, b) { return a.name.localeCompare(b.name, 'vi', { sensitivity: 'base', numeric: true }); });
    courseMap = {}; courses.forEach(function (c) { courseMap[c.id] = c; });
  }
  var PER_CR = 15; /* 2 tín chỉ = 30 tiết, 3 tín chỉ = 45 tiết */
  var YEARS = ['2027–2028', '2026–2027', '2025–2026'];
  var HKS = [1, 2];

  var T = {}, A = [], X = [], SEM = {}, R = {};
  var tiet = function (a) { return a.cr * PER_CR * a.p / 100; };
  var slug = function (s) {
    return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  };
  var loginEmail = function (k) { return k + '@' + DOMAIN; };
  /* Mọi người: tên có sẵn + tên khoa thêm + người đã đăng nhập */
  function people() {
    var m = {};
    DEFAULT_ROSTER.forEach(function (n) { m[slug(n)] = { id: slug(n), name: n, dept: null, guest: false, registered: false }; });
    Object.keys(R).forEach(function (id) { if (!m[id]) m[id] = { id: id, name: R[id].name, dept: null, guest: false, registered: false }; });
    Object.keys(T).forEach(function (id) { var t = T[id]; m[id] = { id: id, name: t.name, dept: t.dept, guest: !!t.guest, registered: true }; });
    return Object.keys(m).map(function (k) { return m[k]; });
  }
  var personOf = function (id) { return people().filter(function (p) { return p.id === id; })[0]; };

  var S = { year: '2026–2027', hk: 1, dept: 'all', tab: 'sum', open: {}, err: '', dbErr: '',
    key: null, isAdmin: false, signedIn: false, authReady: false, teachersLoaded: false,
    au: { mode: 'login', slug: '', email: '', pw: '', pw2: '', dept: 'han', guest: false, err: '', info: '', busy: false },
    d: { q: '', c: '', cr: 3, nl: 1, p: 100 } };
  var skey = function () { return S.year.replace('–', '-') + '_' + S.hk; };
  var key = function () { return skey(); };
  var freshAu = function () { return { mode: 'login', slug: '', email: '', pw: '', pw2: '', dept: 'han', guest: false, err: '', info: '', busy: false }; };

  function statusOf() {
    var s = SEM[skey()];
    if (!s || (!s.force && (!s.open || !s.close))) return 'unset';
    if (s.force) return s.force;
    var t = today();
    if (t < s.open) return 'soon';
    if (t <= s.close) return 'open';
    return 'locked';
  }
  function authMsg(e) {
    var c = e && e.code || '';
    if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found') return 'Mật khẩu chưa đúng.';
    if (c === 'auth/email-already-in-use') return 'Tên này đã có mật khẩu rồi.';
    if (c === 'auth/weak-password') return 'Mật khẩu cần ít nhất 6 ký tự.';
    if (c === 'auth/too-many-requests') return 'Thử quá nhiều lần. Chờ vài phút rồi thử lại.';
    if (c === 'auth/network-request-failed') return 'Mất kết nối mạng. Kiểm tra mạng rồi thử lại.';
    if (c === 'auth/operation-not-allowed') return 'Chưa bật đăng nhập Email/Password trong Firebase.';
    if (c === 'permission-denied') return 'Không có quyền thực hiện. Kiểm tra lại Rules trong Firestore.';
    return 'Chưa thực hiện được. Thử lại sau ít giây.';
  }

  function renderBanners() {
    var h = '';
    if (S.dbErr) h += '<div class="status locked"><b>Chưa đọc được dữ liệu</b><span>' + esc(S.dbErr === 'permission-denied' ? 'Rules của Firestore chưa đúng hoặc chưa Publish.' : 'Mã lỗi: ' + S.dbErr) + '</span></div>';
    var st = statusOf(), s = SEM[skey()] || {};
    if (st === 'open') h += '<div class="status open"><b>Đang mở nhập</b><span>Thầy cô tự nhập đến hết ngày ' + fd(s.close) + '.</span></div>';
    else if (st === 'soon') h += '<div class="status soon"><b>Chưa mở nhập</b><span>Mở từ ' + fd(s.open) + ' đến ' + fd(s.close) + '.</span></div>';
    else if (st === 'unset') h += '<div class="status soon"><b>Chưa mở nhập</b><span>Khoa chưa đặt thời hạn nhập cho học kỳ này.</span></div>';
    else h += '<div class="status locked"><b>Đã khóa</b><span>Học kỳ này chỉ xem, không sửa được. Liên hệ khoa nếu cần chỉnh.</span></div>';
    $('#status').innerHTML = h;
  }

  /* ---------- Tổng hợp ---------- */
  function renderSummary() {
    var k = key();
    var rows = people().filter(function (t) { return S.dept === 'all' || (S.dept === 'guest' ? t.guest : t.dept === S.dept); }).map(function (t) {
      var list = A.filter(function (a) { return a.sem === k && a.tid === t.id; });
      return { t: t, list: list, total: list.reduce(function (s, a) { return s + tiet(a); }, 0) };
    });
    rows.sort(function (a, b) { return b.total - a.total || a.t.name.localeCompare(b.t.name, 'vi'); });
    var entered = rows.filter(function (r) { return r.total > 0; });
    var sum = entered.reduce(function (s, r) { return s + r.total; }, 0);
    var mean = entered.length ? sum / entered.length : 0;
    var max = Math.max.apply(null, rows.map(function (r) { return r.total; }).concat([1]));

    var chips = '<button class="chip" data-act="dept" data-v="all" aria-pressed="' + (S.dept === 'all') + '">Tất cả</button>' +
      DEPTS.map(function (d) { return '<button class="chip" data-act="dept" data-v="' + d.id + '" aria-pressed="' + (S.dept === d.id) + '">' + d.name + '</button>'; }).join('') +
      '<button class="chip" data-act="dept" data-v="guest" aria-pressed="' + (S.dept === 'guest') + '">Thỉnh giảng</button>';

    var body;
    if (!rows.length) {
      body = '<div class="empty">Chưa có giảng viên nào.</div>';
    } else {
      body = rows.map(function (r) {
        var open = !!S.open[r.t.id];
        var w = r.total / max * 100;
        var groups = {}, order = [];
        r.list.forEach(function (a) {
          var g = a.c + '|' + a.cr + '|' + a.p;
          if (!groups[g]) { groups[g] = { a: a, n: 0, t: 0 }; order.push(g); }
          groups[g].n++; groups[g].t += tiet(a);
        });
        var det = order.length ? '<ul>' + order.map(function (g) {
          var o = groups[g], c = cById(o.a.c);
          return '<li><span>' + esc(c ? c.name : '(môn đã xóa)') + '<span class="co">' + o.a.cr + ' tín chỉ' + (o.n > 1 ? ' · ' + o.n + ' lớp' : '') + (o.a.p < 100 ? ' · tỷ lệ ' + o.a.p + '%' : '') + '</span></span><span class="t">' + fmt(o.t) + ' tiết</span></li>';
        }).join('') + '</ul>' : '<p class="hint" style="margin-top:8px">Chưa nhập môn nào.</p>';
        return '<div class="row" data-dept="' + (r.t.dept || '') + '">' +
          '<button class="row-btn" data-act="toggle" data-id="' + esc(r.t.id) + '" aria-expanded="' + open + '">' +
          '<span class="who"><span class="nm">' + esc(r.t.name) + '</span><span class="meta"><i class="dot"></i>' + (r.t.registered ? deptOf(r.t.dept).short + ' · ' + (r.total ? r.list.length + ' lớp' : 'Chưa nhập') : 'Chưa đăng nhập lần nào') + (r.t.guest ? ' <span class="guest">Thỉnh giảng</span>' : '') + '</span></span>' +
          '<span class="bar"><span class="fill" style="width:' + w + '%"></span>' + (r.total && mean ? '<span class="tick" style="left:' + (mean / max * 100) + '%"></span>' : '') + '</span>' +
          (r.total ? '<span class="num">' + fmt(r.total) + '<small>tiết</small></span>' : '<span class="num none">—</span>') +
          '</button><div class="detail"' + (open ? '' : ' hidden') + '>' + det + '</div></div>';
      }).join('') +
      '<div class="total-row"><span>Tổng ' + (S.dept === 'all' ? 'cả khoa' : S.dept === 'guest' ? 'giảng viên thỉnh giảng' : deptOf(S.dept).name) + '</span><span class="num">' + fmt(sum) + '<small>tiết</small></span></div>' +
      '<div class="legend">Vạch đứng trên thanh là mức trung bình (' + fmt(Math.round(mean)) + ' tiết/người). Bấm vào tên để xem các môn.</div>';
    }

    $('#main').innerHTML =
      '<section class="panel"><div class="panel-h"><h2>Số tiết theo giảng viên</h2><div class="chips">' + chips + '</div></div>' +
      '<div class="facts"><span>Đã nhập <b>' + entered.length + '/' + rows.length + '</b> giảng viên</span><span>Tổng <b>' + fmt(sum) + '</b> tiết</span><span>Trung bình <b>' + fmt(Math.round(mean)) + '</b> tiết/người</span></div>' +
      body + '</section>';
  }

  /* ---------- Nhập môn dạy ---------- */

      var cs = courses.filter(function (c) { return c.dept === d.id && (!q || c.name.toLowerCase().indexOf(q) >= 0); });

      return '<optgroup label="' + d.name + '">' + cs.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === S.d.c ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</optgroup>';
    }).join('');
    return any ? html : '<option value="">Không có môn phù hợp</option>';

    var q = S.d.q.trim().toLowerCase();

    if (!visible.some(function (c) { return c.id === S.d.c; })) S.d.c = visible.length ? visible[0].id : '';
    var c = cById(S.d.c);
    if (c && c.cr.indexOf(Number(S.d.cr)) < 0) S.d.cr = c.cr[c.cr.length - 1];
  }
  function crOptions() {
    var c = cById(S.d.c);
    return (c ? c.cr : [3]).map(function (n) { return '<option value="' + n + '"' + (Number(S.d.cr) === n ? ' selected' : '') + '>' + n + ' tín chỉ (' + n * PER_CR + ' tiết)</option>'; }).join('');
  }
  function calcText() {
    var d = S.d;
    if (!cById(d.c)) return '';
    return d.nl + ' lớp × ' + d.cr + ' tín chỉ (' + d.cr * PER_CR + ' tiết) × ' + d.p + '% = <b>' + fmt(d.cr * PER_CR * d.p / 100 * d.nl) + ' tiết</b>';

    if (!S.authReady || (S.key && !S.teachersLoaded)) { $('#main').innerHTML = head + '<p class="hint">Đang tải...</p></div></section>'; return; }

          '<span class="ctl ro">' + fmt(tiet(a)) + ' tiết</span>';

      }).join('') + '</ul><div class="mine-total"><span>Tổng của thầy cô</span><span class="v">' + fmt(total) + ' tiết</span></div>';

    $('#main').innerHTML = head +

      form + '<div class="field" style="gap:10px"><h3 class="sect-h">Các môn thầy cô đã nhập</h3>' + list + '</div></div></section>';

  function render() {
    renderBanners();
    $('#adminTab').hidden = !S.isAdmin;
    if (S.tab === 'admin' && !S.isAdmin) S.tab = 'sum';
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.getAttribute('data-tab') === S.tab); });
    if (S.tab === 'sum') renderSummary(); else if (S.tab === 'enter') renderEnter(); else renderAdmin();

  var dirty = false;
  function typing() {
    var a = document.activeElement;
    return a && $('#main').contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
  }
  function onData() {
    rebuildCourses();
    if (typing()) { dirty = true; renderBanners(); return; }
    render();
  }
  $('#main').addEventListener('focusout', function () {
    setTimeout(function () { if (dirty && !typing()) { dirty = false; render(); } }, 0);
  });

  /* ---------- Sự kiện ---------- */
  $('#fYear').innerHTML = YEARS.map(function (y) { return '<option' + (y === S.year ? ' selected' : '') + '>' + y + '</option>'; }).join('');
  $('#fHk').innerHTML = HKS.map(function (h) { return '<option value="' + h + '">Học kỳ ' + h + '</option>'; }).join('');
  $('#fYear').addEventListener('change', function (e) { S.year = e.target.value; render(); });
  $('#fHk').addEventListener('change', function (e) { S.hk = Number(e.target.value); render(); });
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (!b) return;
    S.tab = b.getAttribute('data-tab'); S.err = ''; render();
  });

  function toast(m) { var s = document.createElement('div'); s.className = 'toast'; s.textContent = m; document.body.appendChild(s); setTimeout(function () { s.remove(); }, 4000); }

  var main = $('#main');
  main.addEventListener('click', async function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    try {
      if (act === 'dept') { S.dept = el.getAttribute('data-v'); render(); }
      else if (act === 'toggle') {
        var open = el.getAttribute('aria-expanded') !== 'true';
        S.open[id] = open; el.setAttribute('aria-expanded', open);
        el.parentNode.querySelector('.detail').hidden = !open;
      }
      else if (act === 'mode') { var m = el.getAttribute('data-v'); S.au.mode = m; S.au.err = ''; S.au.pw = ''; S.au.pw2 = ''; render(); }
      else if (act === 'logout') { await signOut(auth); }
      else if (act === 'delname') { await deleteDoc(doc(db, 'roster', id)); }
      else if (act === 'del') {
        if (statusOf() !== 'open') return;
        await deleteDoc(doc(db, 'assignments', id));
      }
      else if (act === 'force') {
        var v = el.getAttribute('data-v'), s = SEM[skey()] || {};
        var o = {}; if (s.open) o.open = s.open; if (s.close) o.close = s.close; if (v) o.force = v;
        await setDoc(doc(db, 'sems', skey()), o);
      }
    } catch (err) { toast(authMsg(err)); }
  });

  main.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'uEmail') S.au.email = el.value;
    else if (el.id === 'uPw') S.au.pw = el.value;
    else if (el.id === 'uPw2') S.au.pw2 = el.value;
    else if (el.id === 'cQ') {
      S.d.q = el.value; syncDraftCourse();
      $('#cSel').innerHTML = courseOptions(); $('#cCr').innerHTML = crOptions(); $('#calc').innerHTML = calcText();
    }
    else if (el.id === 'cP') {
      var p = Math.round(Number(el.value));
      if (p >= 1 && p <= 100) { S.d.p = p; $('#calc').innerHTML = calcText(); }
    }
  });
  main.addEventListener('change', async function (e) {
    var el = e.target, act = el.getAttribute('data-act');
    try {
      if (el.id === 'uSlug') { var pp = personOf(el.value); S.au.slug = el.value; S.au.mode = pp && pp.registered ? 'login' : 'create'; S.au.err = ''; S.au.pw = ''; S.au.pw2 = ''; render(); }
      else if (el.id === 'uDept') S.au.dept = el.value;
      else if (el.id === 'uGuest') S.au.guest = el.checked;
      else if (act === 'pick') {
        if (el.id === 'cSel') S.d.c = el.value;
        if (el.id === 'cCr') S.d.cr = Number(el.value);
        if (el.id === 'cNl') S.d.nl = Number(el.value);
        S.err = ''; render();
      }
      else if (act === 'edit') {
        if (statusOf() !== 'open') return;
        var n = Math.round(Number(el.value));
        if (n >= 1 && n <= 100) await updateDoc(doc(db, 'assignments', el.getAttribute('data-id')), { p: n });
        else render();
      }
      else if (el.id === 'dOpen' || el.id === 'dClose') {
        var o = $('#dOpen').value, c = $('#dClose').value;
        if (o && c && o <= c) await setDoc(doc(db, 'sems', skey()), { open: o, close: c });
      }
    } catch (err) { toast(authMsg(err)); }
  });

  main.addEventListener('submit', async function (e) {
    e.preventDefault();
    var act = e.target.getAttribute('data-act'), a = S.au;
    try {
      if (act === 'auth') {
        if (a.mode === 'admin') {
          if (!a.email.trim() || !a.pw) { a.err = 'Nhập email và mật khẩu.'; return render(); }
          a.busy = true; a.err = ''; render();
          try { await signInWithEmailAndPassword(auth, a.email.trim(), a.pw); S.au = freshAu(); }
          catch (err) { a.busy = false; a.err = authMsg(err); a.pw = ''; }
          return render();
        }
        var pr = personOf(a.slug);
        if (!pr) { a.err = 'Chọn tên thầy cô trước.'; return render(); }
        if (!a.pw) { a.err = 'Nhập mật khẩu.'; return render(); }
        if (a.mode !== 'login') {
          if (a.pw.length < 6) { a.err = 'Mật khẩu cần ít nhất 6 ký tự.'; return render(); }
          if (a.pw !== a.pw2) { a.err = 'Hai lần nhập mật khẩu chưa giống nhau.'; return render(); }
        }
        a.busy = true; a.err = ''; render();
        try {
          if (a.mode === 'login') {
            await signInWithEmailAndPassword(auth, loginEmail(a.slug), a.pw);
          } else {
            await createUserWithEmailAndPassword(auth, loginEmail(a.slug), a.pw);
            if (a.mode === 'create' || !pr.registered) await setDoc(doc(db, 'teachers', a.slug), { name: pr.name, dept: a.dept, guest: !!a.guest });
          }
          S.au = freshAu();
        } catch (err) {
          a.busy = false; a.pw = ''; a.pw2 = '';
          if (err && err.code === 'auth/email-already-in-use') {
            a.err = a.mode === 'create' ? 'Tên này đã có mật khẩu. Hãy nhập mật khẩu để vào.' : 'Khoa chưa xóa mật khẩu cũ của thầy cô. Nhờ khoa xử lý rồi thử lại.';
            if (a.mode === 'create') a.mode = 'login';
          } else a.err = authMsg(err);
        }
        render();
      } else if (act === 'profile') {
        var p2 = personOf(S.key);
        await setDoc(doc(db, 'teachers', S.key), { name: p2 ? p2.name : S.key, dept: a.dept, guest: !!a.guest });
        a.err = '';
      } else if (act === 'addname') {
        var nn = $('#rName').value.trim().replace(/\s+/g, ' '), kk = slug(nn);
        if (!kk) { $('#rErr').textContent = 'Nhập họ tên.'; return; }
        if (personOf(kk)) { $('#rErr').textContent = 'Tên này đã có trong danh sách.'; return; }
        await setDoc(doc(db, 'roster', kk), { name: nn });
        $('#rName').value = '';
      } else if (act === 'add') {
        if (statusOf() !== 'open' || !S.key) return;
        var d = S.d, p = Math.round(Number(d.p));
        if (!d.c) { S.err = 'Chọn một môn trước.'; return render(); }
        if (!(p >= 1 && p <= 100)) { S.err = 'Tỷ lệ giờ dạy cần từ 1 đến 100.'; return render(); }
        S.err = '';
        for (var i = 0; i < Number(d.nl); i++) {
          await addDoc(collection(db, 'assignments'), { sem: key(), tid: S.key, c: d.c, cr: Number(d.cr), p: p });
        }
        d.nl = 1; d.p = 100;
      } else if (act === 'addcourse') {
        var name = $('#aName').value.trim(), dept = $('#aDept').value;
        var cr = $('#aCr').value.split(',').map(Number);
        if (!name) { $('#aErr').textContent = 'Nhập tên môn.'; return; }
        await addDoc(collection(db, 'customCourses'), { name: name, dept: dept, cr: cr });
        $('#aName').value = '';
      }
    } catch (err) {
      if (act === 'add') { S.err = authMsg(err); render(); } else toast(authMsg(err));
    }
  });

  /* ---------- Kết nối Firebase ---------- */
  rebuildCourses();
  render();
  var onErr = function (err) { S.dbErr = (err && err.code) || 'unavailable'; render(); };
  onAuthStateChanged(auth, function (u) {
    var em = u ? (u.email || '').toLowerCase() : '';
    S.authReady = true; S.signedIn = !!u;
    S.key = em.slice(-(DOMAIN.length + 1)) === '@' + DOMAIN ? em.slice(0, -(DOMAIN.length + 1)) : null;
    S.isAdmin = !!u && ADMIN_EMAILS.some(function (m) { return m.toLowerCase() === em; });
    if (!u) { S.au.pw = ''; S.au.pw2 = ''; }
    render();
  });
  onSnapshot(collection(db, 'teachers'), function (snap) { T = {}; snap.docs.forEach(function (d) { T[d.id] = d.data(); }); S.teachersLoaded = true; S.dbErr = ''; onData(); }, onErr);
  onSnapshot(collection(db, 'assignments'), function (snap) { A = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); onData(); }, onErr);
  onSnapshot(collection(db, 'customCourses'), function (snap) { X = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); onData(); }, onErr);
  onSnapshot(collection(db, 'roster'), function (snap) { R = {}; snap.docs.forEach(function (d) { R[d.id] = d.data(); }); onData(); }, onErr);
  onSnapshot(collection(db, 'sems'), function (snap) { SEM = {}; snap.docs.forEach(function (d) { SEM[d.id] = d.data(); }); onData(); }, onErr);
})();
</script>
</body>
</html>
